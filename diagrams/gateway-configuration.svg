<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 688 752" width="688" height="752">
  <defs>
    <!-- Embedded Typography & Anti-Aliasing -->
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!-- Drop Shadow Filter -->
    <filter id="markdy-node-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#020617" flood-opacity="0.08"/>
    </filter>

    <!-- Grid Patterns -->
    <pattern id="markdy-grid-minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="markdy-grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrow-request" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4 L 3.4 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-minor)"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-major)"/>
  

  <!-- Diagram Title -->
  <g class="markdy-title-layer">
    <text x="48" y="44" class="markdy-svg-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f1c2e" dominant-baseline="central" letter-spacing="-0.02em">Gateway API describes; Kong implements</text>
  </g>
  <!-- Main Scene Content -->
  <g class="markdy-camera-layer">
  <!-- Edge Connections -->
  <g class="markdy-edges-layer">
    <g id="edge-flow_1" class="markdy-edge" >
      <path d="M 186 196 L 186 209 Q 186 222 199 222 L 324 222 Q 338 222 338 236 L 338 264" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="212.4" y="206" width="99.19999999999999" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="262" y="215.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">GatewayClass</text>
      <text x="262" y="228.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">+ Gateway</text>
    </g>
    <g id="edge-flow_2" class="markdy-edge" >
      <path d="M 442 196 L 442 224 Q 442 238 428 238 L 343 238 A 5 5 0 0 1 333 238 L 319 238 Q 306 238 306 251 L 306 264" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="321.1" y="222" width="105.8" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="374" y="231.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">HTTPRoute +</text>
      <text x="374" y="244.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">Kong policies</text>
    </g>
    <g id="edge-flow_3" class="markdy-edge" >
      <path d="M 336 340 L 336 408" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"  marker-end="url(#arrow-event)"/>
      <!-- Edge Label -->
      <rect x="299.6" y="358" width="72.8" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="336" y="367.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">resource</text>
      <text x="336" y="380.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">updates</text>
    </g>
    <g id="edge-flow_4" class="markdy-edge" >
      <path d="M 336 484 L 336 509 Q 336 510 337 510 L 337 510 Q 338 510 338 511 L 338 552" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="284.1" y="494" width="105.8" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="337" y="503.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">translated</text>
      <text x="337" y="516.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">configuration</text>
    </g>
  </g>
  <!-- Node Cards -->
  <g class="markdy-nodes-layer">
    <g id="node-Platform" transform="translate(88, 120)" >
      <rect width="184" height="76" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="183" height="75" rx="15.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#f59e0b" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.4" />
        <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Platform team</text>
    </g>
    <g id="node-App" transform="translate(384, 120)" >
      <rect width="216" height="76" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="215" height="75" rx="15.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#f59e0b" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.4" />
        <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Application team</text>
    </g>
    <g id="node-Kubernetes" transform="translate(248, 264)" >
      <rect width="192" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="191" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#38bdf8" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4.5" width="16" height="6.5" rx="2" />
        <rect x="4" y="13" width="16" height="6.5" rx="2" />
        <path d="M7.5 7.75h.01M7.5 16.25h.01" />
        <path d="M11 7.75h6M11 16.25h6" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Kubernetes API</text>
    </g>
    <g id="node-KIC" transform="translate(208, 408)" >
      <rect width="272" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="271" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#38bdf8" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4.5" width="16" height="6.5" rx="2" />
        <rect x="4" y="13" width="16" height="6.5" rx="2" />
        <path d="M7.5 7.75h.01M7.5 16.25h.01" />
        <path d="M11 7.75h6M11 16.25h6" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Kong Ingress Controller</text>
    </g>
    <g id="node-Kong" transform="translate(256, 552)" >
      <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="179" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#60a5fa" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="12" r="2" />
        <circle cx="19" cy="6" r="2" />
        <circle cx="19" cy="18" r="2" />
        <path d="M7 12h4l5.5-5" />
        <path d="M11 12l5.5 5" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Kong Gateway</text>
    </g>
  </g>
  </g>

  <!-- Watermark -->
  <g class="markdy-watermark" transform="translate(568, 734)">
    <text class="markdy-svg-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="500" fill="#475569" opacity="0.7" dominant-baseline="central">Powered by Markdy</text>
  </g>
</svg>