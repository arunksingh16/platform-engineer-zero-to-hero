      <rect x="331.2" y="510" width="125.6" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="394" y="519.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">route to</text>
      <text x="394" y="532.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">Service endpoint</text>
    </g>
    <g id="edge-flow_6" class="markdy-edge" >
      <path d="M 489 552 L 489 516 Q 489 502 475 502 L 396 502 Q 387 502 387 493 L 387 484" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"  marker-end="url(#arrow-response)"/>
      <!-- Edge Label -->
      <rect x="471.4" y="518" width="99.19999999999999" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="521" y="527" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">API response</text>
    </g>
    <g id="edge-flow_7" class="markdy-edge" >
      <path d="M 380 408 L 380 367.5 Q 380 358 389.5 358 L 390 358 Q 399 358 399 349 L 399 340" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"  marker-end="url(#arrow-response)"/>
      <!-- Edge Label -->
      <rect x="382.6" y="367" width="72.8" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="419" y="376.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">API</text>
      <text x="419" y="389.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">response</text>
    </g>
    <g id="edge-flow_8" class="markdy-edge" >
      <path d="M 281 264 L 281 247 Q 281 238 290 238 L 290 238 Q 299 238 299 229 L 299 196" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"  marker-end="url(#arrow-response)"/>
      <!-- Edge Label -->
      <rect x="221.6" y="222" width="72.8" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="258" y="231.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">API</text>
      <text x="258" y="244.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">response</text>
    </g>
  </g>
  <!-- Node Cards -->
  <g class="markdy-nodes-layer">
    <g id="node-Partner" transform="translate(248, 120)" >
      <rect width="192" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="191" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#f59e0b" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5" />
        <path d="M3 9h18" />
        <path d="M7 7h.01M10 7h.01" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Partner client</text>
    </g>
    <g id="node-Entry" transform="translate(212, 264)" >
      <rect width="264" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="263" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#60a5fa" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="12" r="2" />
        <circle cx="19" cy="6" r="2" />
        <circle cx="19" cy="18" r="2" />
        <path d="M7 12h4l5.5-5" />
        <path d="M11 12l5.5 5" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">External load balancer</text>
    </g>
    <g id="node-Kong" transform="translate(256, 408)" >
      <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="179" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#60a5fa" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="12" r="2" />
        <circle cx="19" cy="6" r="2" />
        <circle cx="19" cy="18" r="2" />
        <path d="M7 12h4l5.5-5" />
        <path d="M11 12l5.5 5" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Kong Gateway</text>
    </g>
    <g id="node-Redis" transform="translate(56, 552)" >
      <rect width="272" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="271" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#22c55e" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 5 13h6l-1 9 9-13h-6l0-7Z" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Shared counters (Redis)</text>
    </g>
    <g id="node-Orders" transform="translate(364, 552)" >
      <rect width="180" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#markdy-node-shadow)"/>
      <rect x="0.5" y="0.5" width="179" height="75" rx="11.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Frameless Icon Glyph -->
      <g transform="translate(16, 25) scale(1.0833333333333333)" fill="none" stroke="#c084fc" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 20 7.5v9L12 21 4 16.5v-9L12 3Z" />
        <path d="M8.75 10.5h6.5v5h-6.5z" />
      </g>
      <!-- Label -->
      <text x="54" y="38" class="markdy-svg-text" font-size="13.5" font-weight="600" letter-spacing="-0.01em" fill="#0f1c2e" dominant-baseline="central">Orders Pod</text>
    </g>
  </g>
  </g>

  <!-- Watermark -->
  <g class="markdy-watermark" transform="translate(568, 734)">
    <text class="markdy-svg-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="500" fill="#475569" opacity="0.7" dominant-baseline="central">Powered by Markdy</text>
  </g>
</svg>