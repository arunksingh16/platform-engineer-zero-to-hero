<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 688 752" width="688" height="752">
  <defs>
    <!-- Embedded Typography & Anti-Aliasing -->
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .markdy-svg-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!-- Drop Shadow Filter -->
    <filter id="markdy-node-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#020617" flood-opacity="0.08"/>
    </filter>

    <!-- Grid Patterns -->
    <pattern id="markdy-grid-minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="markdy-grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrow-request" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4 L 3.4 5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 1.6 L 9 5 L 1.5 8.4" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  
  <rect width="100%" height="100%" fill="#f6f8fc"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-minor)"/>
  <rect width="100%" height="100%" fill="url(#markdy-grid-major)"/>
  

  <!-- Diagram Title -->
  <g class="markdy-title-layer">
    <text x="48" y="44" class="markdy-svg-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f1c2e" dominant-baseline="central" letter-spacing="-0.02em">The request goes through the proxy, not KIC</text>
  </g>
  <!-- Main Scene Content -->
  <g class="markdy-camera-layer">
  <!-- Edge Connections -->
  <g class="markdy-edges-layer">
    <g id="edge-flow_1" class="markdy-edge" >
      <path d="M 336 196 L 336 264" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="302.9" y="214" width="66.19999999999999" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="336" y="223.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">HTTPS</text>
      <text x="336" y="236.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">/orders</text>
    </g>
    <g id="edge-flow_2" class="markdy-edge" >
      <path d="M 336 340 L 336 365 Q 336 366 337 366 L 337 366 Q 338 366 338 367 L 338 408" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="303.9" y="350" width="66.19999999999999" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="337" y="359.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">forward</text>
      <text x="337" y="372.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">request</text>
    </g>
    <g id="edge-flow_3" class="markdy-edge" >
      <path d="M 340 484 L 340 497 Q 340 510 327 510 L 212 510 Q 198 510 198 524 L 198 552" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
      <!-- Edge Label -->
      <rect x="212.8" y="494" width="112.39999999999999" height="32" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="269" y="503.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">check / update</text>
      <text x="269" y="516.5" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">allowance</text>
    </g>
    <g id="edge-flow_4" class="markdy-edge" >
      <path d="M 134 552 L 134 539 Q 134 526 147 526 L 193 526 A 5 5 0 0 0 203 526 L 291 526 Q 305 526 305 512 L 305 484" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"  marker-end="url(#arrow-response)"/>
      <!-- Edge Label -->
      <rect x="105.9" y="517" width="99.19999999999999" height="18" rx="4" fill="#f6f8fc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="155.5" y="526" class="markdy-svg-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle" dominant-baseline="central">within limit</text>
    </g>
    <g id="edge-flow_5" class="markdy-edge" >
      <path d="M 311 484 L 311 512 Q 311 526 325 526 L 400 526 Q 413 526 413 539 L 413 552" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"   marker-end="url(#arrow-request)"/>
