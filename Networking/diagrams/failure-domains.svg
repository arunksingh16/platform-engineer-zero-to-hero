<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Distribute a fleet across failure domains and count survivors</title>
  <desc id="desc">A resilient frontend steers requests to two 500-rps VMs in each of three zones. Losing zone A leaves four VMs, only 2000 rps safe capacity, below the 2400-rps demand.</desc>
  <rect width="800" height="400" rx="16" fill="#102a40"/>
  <g font-family="system-ui,sans-serif" fill="#e3edf5">
    <text x="30" y="38" font-size="21" font-weight="700">Count capacity after removing a whole failure domain</text>
    <rect x="190" y="66" width="420" height="55" rx="10" fill="#17354c" stroke="#6a8a9e"/>
    <text x="400" y="100" text-anchor="middle" font-size="18">Resilient frontend · demand 2,400 rps</text>
    <g stroke="#67d8c3" stroke-width="2" fill="none"><path d="M400 121 V145 H145 V170" stroke-dasharray="5 5"/><path d="M400 121 V170"/><path d="M400 145 H655 V170"/></g>
    <g fill="#17354c" stroke="#6a8a9e"><rect x="30" y="170" width="230" height="145" rx="10"/><rect x="285" y="170" width="230" height="145" rx="10"/><rect x="540" y="170" width="230" height="145" rx="10"/></g>
    <g text-anchor="middle" font-size="18"><text x="145" y="202" fill="#f08a8a">Zone A · OFFLINE</text><text x="400" y="202">Zone B · serving</text><text x="655" y="202">Zone C · serving</text><text x="145" y="244">2 VMs unavailable</text><text x="400" y="244">2 VMs × 500 rps</text><text x="655" y="244">2 VMs × 500 rps</text><text x="145" y="285" fill="#f08a8a">0 rps</text><text x="400" y="285" fill="#67d8c3">1,000 rps</text><text x="655" y="285" fill="#67d8c3">1,000 rps</text></g>
    <text x="30" y="354" font-size="18">2,400 demand − 2,000 surviving safe capacity = 400 rps shortfall</text>
    <text x="30" y="380" font-size="15" fill="#b5c8d6">Assumes even distribution and measured safe VM capacity. No instant replacement VMs.</text>
  </g>
</svg>
