<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Separate DNS, media delivery and private API traffic</title>
  <desc id="desc">DNS returns an entry address to the listener. Media requests go through an edge cache; only misses reach a protected media origin. Private playlists go through an API proxy to private API VMs and data. DNS is not in the HTTP data path.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#67d8c3"/></marker></defs>
  <rect width="800" height="450" rx="16" fill="#102a40"/>
  <g font-family="system-ui,sans-serif" fill="#e3edf5">
    <text x="30" y="38" font-size="21" font-weight="700">One application, three different paths</text>
    <g fill="#17354c" stroke="#6a8a9e"><rect x="30" y="170" width="140" height="90" rx="10"/><rect x="280" y="70" width="210" height="65" rx="10"/><rect x="280" y="175" width="210" height="65" rx="10"/><rect x="570" y="175" width="200" height="65" rx="10"/><rect x="280" y="300" width="210" height="65" rx="10"/><rect x="570" y="300" width="200" height="65" rx="10"/></g>
    <g text-anchor="middle" font-size="18"><text x="100" y="221">Listener</text><text x="385" y="98">DNS resolver</text><text x="385" y="203">Edge cache</text><text x="670" y="203">Protected origin</text><text x="385" y="328">API proxy</text><text x="670" y="328">Private API VMs</text></g>
    <g text-anchor="middle" fill="#b5c8d6" font-size="14"><text x="385" y="121">Discovery only</text><text x="385" y="226">Hit: return media bytes</text><text x="670" y="226">Miss: fetch media bytes</text><text x="385" y="351">Authenticated, no shared cache</text><text x="670" y="351">Then private data service</text></g>
    <g stroke="#67d8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M130 170 V103 H270" stroke-dasharray="5 5"/><path d="M170 208 H270"/><path d="M490 208 H560"/><path d="M130 260 V333 H270"/><path d="M490 333 H560"/></g>
    <text x="506" y="191" font-size="14" fill="#67d8c3">miss</text>
    <text x="30" y="405" font-size="16">Arrows show request direction. Responses return on their corresponding connections.</text>
    <text x="30" y="430" font-size="15" fill="#b5c8d6">Public entry does not require public backend IPs. Origin access must resist bypass.</text>
  </g>
</svg>
