# This DNS selector targets conventional CoreDNS Pods. Node-local DNS or a
# different DNS installation needs its own tested allowance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-and-dns
  namespace: pe-lab
spec:
  podSelector:
    matchLabels:
      app: echo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: echo
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: echo
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
